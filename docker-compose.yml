services:
  ratelimit-api:
    build: ./ratelimit-api
    command: ["node", "server.js"]
    ports:
      - "3000:3000"

  mock-payment:
    build: ./ratelimit-api
    command: ["node", "mock-payment.js"]
    ports:
      - "4000:4000"

  perf-api:
    build: ./perf-api
    ports:
      - "5050:5000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  bank-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa_local_only
      POSTGRES_DB: bank
    ports:
      - "5433:5432"
    volumes:
      - ./bank-api/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d bank"]
      interval: 2s
      timeout: 3s
      retries: 15

  bank-api:
    build: ./bank-api
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgresql://qa:qa_local_only@bank-db:5432/bank
    depends_on:
      bank-db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
