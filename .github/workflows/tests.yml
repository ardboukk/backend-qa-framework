name: API tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start test servers in containers
        run: docker compose up -d --build

      - name: Wait until both servers are ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/hello > /dev/null && curl -s http://localhost:4000/pay > /dev/null; then
              echo "Both servers are ready"
              exit 0
            fi
            sleep 1
          done
          echo "Servers did not start within 30 seconds"
          docker compose logs
          exit 1

      - name: Run the tests
        run: pytest -v

      - name: Stop test servers
        if: always()
        run: docker compose down

  postman:
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run the Postman collection
        run: newman run postman/collection.json -e postman/environment.json -r cli,htmlextra --reporter-htmlextra-export newman-report.html

      - name: Save the HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-report
          path: newman-report.html

  perf-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Start perf-api
        run: docker compose up -d --build perf-api

      - name: Wait until perf-api answers
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5050/fast && exit 0
            sleep 1
          done
          echo "perf-api did not start in 30 s"
          docker compose logs perf-api
          exit 1

      - name: Run smoke performance test (k6 2.3.0)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --network host \
            -v "$PWD/perf:/perf" \
            -e BASE_URL=http://localhost:5050 \
            -e K6_WEB_DASHBOARD=true \
            -e K6_WEB_DASHBOARD_EXPORT=/perf/smoke-report.html \
            grafana/k6:2.3.0 run /perf/smoke.js

      - name: Save the performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-smoke-report
          path: perf/smoke-report.html
          if-no-files-found: error

      - name: Stop services
        if: always()
        run: docker compose down
