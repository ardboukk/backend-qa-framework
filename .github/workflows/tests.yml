name: API tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start test servers in containers
        run: docker compose up -d --build

      - name: Wait until both servers are ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/hello > /dev/null && curl -s http://localhost:4000/pay > /dev/null; then
              echo "Both servers are ready"
              exit 0
            fi
            sleep 1
          done
          echo "Servers did not start within 30 seconds"
          docker compose logs
          exit 1

      - name: Run the tests
        run: pytest -v

      - name: Stop test servers
        if: always()
        run: docker compose down

  postman:
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run the Postman collection
        run: newman run postman/collection.json -e postman/environment.json -r cli,htmlextra --reporter-htmlextra-export newman-report.html

      - name: Save the HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-report
          path: newman-report.html
